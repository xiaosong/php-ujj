# 保留原始 tokumeikoi/lcrp8 的目录约定；迁移前需验证配置与应用兼容性
# 内层 Caddy 仅监听 :80，提供静态文件和 PHP，不需要证书卷
services:
  lcrp8:
    image: ghcr.io/xiaosong/php-ujj:php84
    restart: always
    # 为容器提供独立的 PID 1 init
    init: true
    # 阻止 setuid 等途径提权（容器本身已以 root 启动，见 README「已知风险」）
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./www:/www                                  # 站点代码
      - ./wwwlogs:/wwwlogs                          # php-fpm / slow 日志
      - ./Caddyfile:/run/caddy/Caddyfile:ro         # Caddy 配置（原镜像就是从这读的）
      # - ./supervisord.d:/run/supervisor:ro        # 仅加载其中的 supervisord.conf
      # - ./php.ini:/etc/php84/php.ini:ro           # 建议挂载到所选 PHP 的实际版本路径
      # - /etc/localtime:/etc/localtime:ro
    ulimits:
      nofile: 50000
    # 需要调 pm.max_children 时再放开
    # deploy:
    #   resources:
    #     limits:
    #       memory: 2g
