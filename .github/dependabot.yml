version: 2
updates:
  # CI 里的 action 固定到 commit SHA，由 Dependabot 提 PR 升级
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Caddy 使用 caddy:2-alpine 浮动 tag，Alpine 走 ALPINE_VERSION 构建参数，
  # 两者都没有可被 Dependabot 跟踪的版本号，因此这里不再配置 docker ecosystem。
