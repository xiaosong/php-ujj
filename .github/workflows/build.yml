name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # 每周一 03:17 (UTC) 重建一次：让 alpine 的安全更新自动进来
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      php_major:
        description: "PHP 主版本"
        type: choice
        options: ["84", "83", "82", "85"]
        default: "84"
      icu_data:
        description: "ICU 数据（full=完整 locale，en=瘦身）"
        type: choice
        options: ["full", "en"]
        default: "full"

env:
  IMAGE: ghcr.io/${{ github.repository }}

concurrency:
  group: image-${{ github.repository }}-${{ github.ref }}-${{ inputs.php_major || '84' }}-${{ inputs.icu_data || 'full' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
      php_major: ${{ steps.vars.outputs.php_major }}
      icu_data: ${{ steps.vars.outputs.icu_data }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # workflow_dispatch 的输入不直接进 shell / build-args，先白名单校验再输出
      - name: Validate inputs
        id: vars
        env:
          PHP_MAJOR: ${{ inputs.php_major || '84' }}
          ICU_DATA: ${{ inputs.icu_data || 'full' }}
        run: |
          set -eu
          case "${PHP_MAJOR}" in
            82) ALPINE_VERSION=3.22 ;;  # 3.24 仓库没有 php82
            83|84|85) ALPINE_VERSION=3.24 ;;
            *) echo "unsupported php_major: ${PHP_MAJOR}" >&2; exit 1 ;;
          esac
          case "${ICU_DATA}" in
            full) VARIANT="php${PHP_MAJOR}" ;;
            en) VARIANT="php${PHP_MAJOR}-en" ;;
            *) echo "unsupported icu_data: ${ICU_DATA}" >&2; exit 1 ;;
          esac
          echo "php_major=${PHP_MAJOR}" >> "$GITHUB_OUTPUT"
          echo "alpine_version=${ALPINE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "icu_data=${ICU_DATA}" >> "$GITHUB_OUTPUT"
          echo "variant=${VARIANT}" >> "$GITHUB_OUTPUT"

      - name: Meta
        id: meta
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.vars.outputs.variant }},enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ steps.vars.outputs.variant }}-{{date 'YYYYMMDD'}},enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=tag,enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.vars.outputs.variant == 'php84' }}

      - name: Build candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          # 生成 SLSA provenance 与 SBOM，随镜像一起推到 GHCR
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          # 重跑也刷新 apk 层，避免复用旧的安全更新结果
          build-args: |
            PHP_MAJOR=${{ steps.vars.outputs.php_major }}
            ALPINE_VERSION=${{ steps.vars.outputs.alpine_version }}
            ICU_DATA=${{ steps.vars.outputs.icu_data }}
            APK_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 各架构在原生 runner 上测试：qemu 仿真下 Redis 的 MADV_FREE/fork 内核探测会误判，
  # 直接 exit 1（ARM64-COW-BUG），无法用来判断镜像本身是否正常。
  test:
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test candidate
        env:
          PHP_MAJOR: ${{ needs.build.outputs.php_major }}
          ICU_DATA: ${{ needs.build.outputs.icu_data }}
          DIGEST: ${{ needs.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          bash smoke-test.sh "${IMAGE}@${DIGEST}" "${PLATFORM}"

  promote:
    needs: [build, test]
    # needs 自带 success()：两个架构的测试都通过才会执行
    if: needs.build.outputs.tags != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified image
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          TAGS: ${{ needs.build.outputs.tags }}
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              tag_args+=(-t "$tag")
            fi
          done <<< "$TAGS"
          docker buildx imagetools create "${tag_args[@]}" "${IMAGE}@${DIGEST}"
          {
            printf '## Verified image\n\n`%s@%s`\n\n' "$IMAGE" "$DIGEST"
            printf 'Tags:\n```text\n%s\n```\n' "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
